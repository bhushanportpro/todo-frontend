name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  LOCATION_PATH: /var/www/html/todo-frontend
  PREVIOUS_PATH: /var/www/html/todo-frontend-previous

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-production
      cancel-in-progress: false

    steps:
      - name: Build and deploy
        run: |
          set -e
          git -c http.extraheader="AUTHORIZATION: bearer $GITHUB_TOKEN" \
            clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" source
          cd source
          npm ci
          npm run build
          test -d out

          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/key.pem"
          chmod 600 "$RUNNER_TEMP/key.pem"
          SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $RUNNER_TEMP/key.pem"
          SCP="scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $RUNNER_TEMP/key.pem"
          TEMP_PATH="/tmp/todo-frontend-$GITHUB_SHA"

          $SSH "$EC2_USER@$EC2_HOST" "rm -rf '$TEMP_PATH' && mkdir -p '$TEMP_PATH'"
          $SCP -r out/. "$EC2_USER@$EC2_HOST:$TEMP_PATH/"
          $SSH "$EC2_USER@$EC2_HOST" "
            set -e
            rm -rf '$PREVIOUS_PATH'
            if [ -d '$LOCATION_PATH' ]; then
              mv '$LOCATION_PATH' '$PREVIOUS_PATH'
            fi
            mv '$TEMP_PATH' '$LOCATION_PATH'
          "
          rm -f "$RUNNER_TEMP/key.pem"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

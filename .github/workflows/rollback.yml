name: Rollback

on:
  workflow_dispatch:

env:
  LOCATION_PATH: /var/www/html/todo-frontend
  PREVIOUS_PATH: /var/www/html/todo-frontend-previous

jobs:
  rollback:
    name: Rollback frontend
    runs-on: ubuntu-latest

    steps:
      - name: Swap current and previous deployments
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/key.pem"
          chmod 600 "$RUNNER_TEMP/key.pem"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i "$RUNNER_TEMP/key.pem" "$EC2_USER@$EC2_HOST" "
              set -e
              if [ ! -d '$PREVIOUS_PATH' ]; then
                echo 'No previous deployment is available for rollback.'
                exit 1
              fi
              rm -rf '${LOCATION_PATH}-rollback-temp'
              mv '$LOCATION_PATH' '${LOCATION_PATH}-rollback-temp'
              mv '$PREVIOUS_PATH' '$LOCATION_PATH'
              mv '${LOCATION_PATH}-rollback-temp' '$PREVIOUS_PATH'
            "
          rm -f "$RUNNER_TEMP/key.pem"

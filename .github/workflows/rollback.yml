name: Rollback

on:
  workflow_dispatch:

env:
  LOCATION_PATH: /var/www/html/todo-frontend
  PREVIOUS_PATH: /var/www/html/todo-frontend-previous
  SWAP_PATH: /var/www/html/todo-frontend-rollback-temp

jobs:
  rollback:
    name: Rollback frontend
    runs-on: ubuntu-latest

    steps:
      - name: Swap current and previous folders on EC2 (one SSH connection)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          # Stop early with a clear message if a secret is empty or missing.
          # (Without this check, an empty secret gives a confusing "usage: ssh" error.)
          if [ -z "$EC2_HOST" ]; then echo "Secret EC2_HOST is empty or missing in this repo"; exit 1; fi
          if [ -z "$EC2_USER" ]; then echo "Secret EC2_USER is empty or missing in this repo"; exit 1; fi
          if [ -z "$EC2_SSH_KEY" ]; then echo "Secret EC2_SSH_KEY is empty or missing in this repo"; exit 1; fi

          # Save the SSH key in a file and lock it
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # ONE connection: everything between the double quotes runs on the EC2 server.
          # The swap uses a temporary third folder, like swapping two cups using a third cup.
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "
            set -e
            if [ ! -d '$PREVIOUS_PATH' ]; then
              echo 'No previous deployment is available for rollback.'
              exit 1
            fi

            echo 'Version online now (will be moved away):'
            cat '$LOCATION_PATH/.version' 2>/dev/null || echo unknown
            echo 'Version coming back:'
            cat '$PREVIOUS_PATH/.version' 2>/dev/null || echo unknown

            rm -rf '$SWAP_PATH'
            mv '$LOCATION_PATH' '$SWAP_PATH'
            mv '$PREVIOUS_PATH' '$LOCATION_PATH'
            mv '$SWAP_PATH' '$PREVIOUS_PATH'

            echo 'Rollback done. Version online now:'
            cat '$LOCATION_PATH/.version' 2>/dev/null || echo unknown
          "